[project]
name = "eg4-ha"
version = "0.2.5"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.23.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "homeassistant>=2024.5.0", # Added Home Assistant
    "pytest-cov>=4.1.0", # Added pytest-cov
    "ruff>=0.1.0",
    "black>=23.0.0",
    "isort>=5.0.0",
    "pyppeteer>=2.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict" # Explicitly set, though it was defaulting to this
asyncio_default_fixture_loop_scope = "function"

